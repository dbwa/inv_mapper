; Configuration PHP pour l'environnement de developpement local.
; Alignee sur les valeurs de la production.

memory_limit = 1536M
post_max_size = 1536M
upload_max_filesize = 1536M
max_execution_time = 0

date.timezone = UTC

; Les erreurs doivent etre visibles en local, contrairement a la production.
display_errors = On
display_startup_errors = On
error_reporting = E_ALL

; Le site utilise des sessions PHP
session.gc_maxlifetime = 86400

; PHP 8.4 : les sessions utilisent des cookies SameSite par defaut, on garde le comportement historique
session.cookie_samesite = Lax
; PHP 8.4 : evite les avertissements de depreciation sur les conversions implicites
error_reporting = E_ALL
